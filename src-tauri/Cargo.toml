[package]
name = "Tsuru"
version = "0.0.1"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tsuru_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }

[dependencies]
tauri = { version = "2.12.7", features = [] }
tauri-plugin-opener = "2.7.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri-plugin-shell = "2.6.0"
tauri-plugin-process = "2.4.0"
tauri-plugin-updater = "2.14.1"
ts-rs = "12.0.1"
base64 = "0.23.1"
uuid = { version = "1.29.3", features = ["v4", "fast-rng"] } # If Tsuru ever adds features like: Generating API tokens, Generating secure keys, Doing anything in auth or encryption
deunicode = "1.6.2"
percent-encoding = "2.3.2"
html-escape = "0.3.1"
data-encoding = "2.11.1"
punycode = "0.4.1"

[dev-dependencies]
syn = { version = "3.0.10", features = ["full"] }
indoc = "2.0.8"
quote = "1.0.47"
